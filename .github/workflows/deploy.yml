name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://federicotassara.com
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_AKINTU_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_AKINTU_CLIENT_KEY }}
      NEXT_PUBLIC_AKINTU_API_URL: ${{ vars.NEXT_PUBLIC_AKINTU_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Record release version
        run: printf '%s' "$GITHUB_SHA" > public/deploy-version.txt
      - run: npm run build
      - name: Package standalone server
        run: tar --exclude='.env*' -czf deploy.tar .next/standalone .next/static public content deploy/Dockerfile captain-definition
      - name: Deploy to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP: ${{ vars.CAPROVER_APP_NAME }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: npx --yes caprover@2.3.1 deploy --tarFile ./deploy.tar
      - name: Verify deployed release
        run: |
          for attempt in $(seq 1 36); do
            version=$(curl --fail --silent --max-time 10 "https://federicotassara.com/deploy-version.txt?release=$GITHUB_SHA" || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "The expected release did not become available."
          exit 1
