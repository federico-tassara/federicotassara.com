<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Flusso tecnico dell'agentic commerce</title>
  <desc id="desc">Un cliente delega una richiesta a un agente, che scopre prodotti tramite dati strutturati, prepara il checkout e chiede conferma prima del pagamento.</desc>
  <rect width="1200" height="630" rx="36" fill="#f5f3ee"/>
  <text x="70" y="84" fill="#1c1f33" font-family="Arial, sans-serif" font-size="34" font-weight="700">Dalla richiesta al checkout: dove servono i confini</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 175)">
      <rect width="205" height="225" rx="26" fill="#fff" stroke="#d9d6cf" stroke-width="3"/>
      <circle cx="102" cy="67" r="34" fill="#1c1f33"/>
      <text x="102" y="76" text-anchor="middle" fill="#fff" font-size="28">1</text>
      <text x="102" y="133" text-anchor="middle" fill="#1c1f33" font-size="22" font-weight="700">Intenzione</text>
      <text x="102" y="168" text-anchor="middle" fill="#4b5068" font-size="17">vincoli, budget,</text>
      <text x="102" y="194" text-anchor="middle" fill="#4b5068" font-size="17">preferenze</text>
    </g>
    <path d="M290 287H345" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
    <path d="m331 271 18 16-18 16" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linejoin="round"/>
    <g transform="translate(360 175)">
      <rect width="205" height="225" rx="26" fill="#fff" stroke="#d9d6cf" stroke-width="3"/>
      <circle cx="102" cy="67" r="34" fill="#6d28d9"/>
      <text x="102" y="76" text-anchor="middle" fill="#fff" font-size="28">2</text>
      <text x="102" y="133" text-anchor="middle" fill="#1c1f33" font-size="22" font-weight="700">Scoperta</text>
      <text x="102" y="168" text-anchor="middle" fill="#4b5068" font-size="17">catalogo, prezzi,</text>
      <text x="102" y="194" text-anchor="middle" fill="#4b5068" font-size="17">disponibilità</text>
    </g>
    <path d="M580 287H635" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
    <path d="m621 271 18 16-18 16" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linejoin="round"/>
    <g transform="translate(650 175)">
      <rect width="205" height="225" rx="26" fill="#fff" stroke="#d9d6cf" stroke-width="3"/>
      <circle cx="102" cy="67" r="34" fill="#d97706"/>
      <text x="102" y="76" text-anchor="middle" fill="#fff" font-size="28">3</text>
      <text x="102" y="133" text-anchor="middle" fill="#1c1f33" font-size="22" font-weight="700">Conferma</text>
      <text x="102" y="168" text-anchor="middle" fill="#4b5068" font-size="17">totale, consegna,</text>
      <text x="102" y="194" text-anchor="middle" fill="#4b5068" font-size="17">consenso umano</text>
    </g>
    <path d="M870 287H925" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
    <path d="m911 271 18 16-18 16" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linejoin="round"/>
    <g transform="translate(940 175)">
      <rect width="190" height="225" rx="26" fill="#e8f5ef" stroke="#84c9aa" stroke-width="3"/>
      <circle cx="95" cy="67" r="34" fill="#047857"/>
      <text x="95" y="76" text-anchor="middle" fill="#fff" font-size="28">4</text>
      <text x="95" y="133" text-anchor="middle" fill="#1c1f33" font-size="22" font-weight="700">Esecuzione</text>
      <text x="95" y="168" text-anchor="middle" fill="#4b5068" font-size="17">pagamento, ordine,</text>
      <text x="95" y="194" text-anchor="middle" fill="#4b5068" font-size="17">audit trail</text>
    </g>
    <rect x="310" y="455" width="580" height="72" rx="20" fill="#1c1f33"/>
    <text x="600" y="487" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Il protocollo collega i sistemi.</text>
    <text x="600" y="514" text-anchor="middle" fill="#d8dbe8" font-size="18">Identità, autorizzazione e responsabilità restano da progettare.</text>
  </g>
</svg>
